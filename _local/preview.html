<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GameDev Hub · 화면 미리보기 (로컬 전용)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧪</text></svg>" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  /* 하네스 전용 레이아웃. 앱 스타일시트는 팔레트 재사용 목적으로만 참조한다. */
  body{overflow:hidden}
  .harness{display:grid;grid-template-columns:236px 1fr;height:100vh}
  .rail{border-right:1px solid var(--line);background:rgba(18,26,43,.72);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
  .rail h1{font-size:15px;margin:0}
  .rail .tagline{font-size:11.5px;color:var(--muted);line-height:1.5}
  .routes{display:flex;flex-direction:column;gap:2px}
  .routes button{
    text-align:left;background:none;border:1px solid transparent;border-radius:10px;
    padding:8px 10px;color:var(--text2);cursor:pointer;font-size:13px;width:100%
  }
  .routes button:hover{background:var(--panel2)}
  .routes button.active{background:var(--panel3);border-color:var(--line2);color:#fff;font-weight:600}
  .routes small{display:block;color:var(--muted);font-size:11px;font-family:var(--mono)}
  .stage{display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .bar select,.bar input{width:auto}
  .canvas{flex:1;overflow:auto;padding:18px;background:#070c16}
  .frame-wrap{margin:0 auto;background:var(--bg);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .frame-wrap header{display:flex;justify-content:space-between;padding:6px 12px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel)}
  iframe{display:block;border:0;width:100%;background:var(--bg)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
  .gallery .frame-wrap{margin:0}
  .warn-strip{font-size:11.5px;color:var(--warn);border:1px solid #6b5a2a;background:#1d1a10;border-radius:10px;padding:8px 10px;line-height:1.5}
</style>
</head>
<body>
<div class="harness">
  <aside class="rail">
    <div>
      <h1>🧪 화면 미리보기</h1>
      <p class="tagline">로컬 전용 하네스입니다. <code>_local/</code> 폴더는 배포물에 포함되지 않습니다.</p>
    </div>

    <div class="routes" id="routes"></div>

    <div class="stack" style="gap:8px">
      <strong style="font-size:12px;color:var(--muted)">데이터</strong>
      <button class="btn btn-sm" data-tool="seed">데모 데이터 재주입</button>
      <button class="btn btn-sm" data-tool="bulk">대용량 샘플 (Task 200)</button>
      <button class="btn btn-sm" data-tool="empty">빈 상태로 만들기</button>
      <button class="btn btn-sm btn-danger" data-tool="wipe">저장소 완전 삭제</button>
      <p class="warn-strip">이 버튼들은 브라우저 localStorage만 건드립니다. Apps Script·GitHub 연동은 사용하지 않습니다.</p>
    </div>

    <div class="sidebar-foot">
      <a class="plan-link" href="../index.html" target="_blank" rel="noopener">앱 새 탭에서 열기 ↗</a>
      <a class="plan-link" href="../README.md" target="_blank" rel="noopener">README</a>
    </div>
  </aside>

  <main class="stage">
    <div class="bar">
      <label class="field" style="max-width:150px">
        <select id="mode">
          <option value="single">단일 화면</option>
          <option value="gallery">전체 화면 한눈에</option>
        </select>
      </label>
      <label class="field" style="max-width:170px">
        <select id="viewport"></select>
      </label>
      <button class="btn btn-sm" id="reload">새로고침</button>
      <div class="spacer"></div>
      <span class="muted" id="status" style="font-size:12px"></span>
    </div>
    <div class="canvas" id="canvas"></div>
  </main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script type="module" src="./preview.js"></script>
</body>
</html>
